name: promtail release

on:
  push:
    tags:
      - "v*-promtail.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, e.g. v1.20.0-promtail.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag
        id: tag
        run: |
          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?-promtail\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a release tag like v1.20.0-promtail.1"
            exit 1
          fi
          {
            echo "version=${TAG#v}"
            echo "upstream=${TAG%-promtail.*}"
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/alloy-promtail"
            if [[ $TAG == *-rc.* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi
          } >>"$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate upstream version
        id: latest
        env:
          UPSTREAM: ${{ steps.tag.outputs.upstream }}
        run: |
          git fetch --quiet --no-tags https://github.com/grafana/alloy.git 'refs/tags/v*:refs/tags/v*'
          described=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-promtail.*' HEAD)
          if [ "$described" != "$UPSTREAM" ]; then
            echo "::error::$TAG names upstream $UPSTREAM, but the latest upstream release merged into it is $described"
            exit 1
          fi
          newest=$(git tag -l 'v*-promtail.*' | grep -v -- '-rc\.' | sort -V | tail -n 1)
          if [ "$TAG" = "$newest" ]; then echo "latest=true" >>"$GITHUB_OUTPUT"; else echo "latest=false" >>"$GITHUB_OUTPUT"; fi

      - name: Collect build arguments
        id: args
        run: |
          {
            echo "epoch=$(git log -1 --format=%ct)"
            echo "build-args<<EOF"
            echo "VERSION=$TAG"
            echo "GIT_REVISION=$(git rev-parse --short HEAD)"
            echo "GIT_BRANCH=$TAG"
            echo "BUILD_DATE=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          # The workflow context points at the default branch on workflow_dispatch.
          context: git
          images: ${{ steps.tag.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.tag.outputs.version }}
            type=raw,value=latest,enable=${{ steps.latest.outputs.latest == 'true' }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.args.outputs.epoch }}
        with:
          context: .
          file: promtail/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: ${{ steps.args.outputs.build-args }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=promtail-image

      - name: Export binaries
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.args.outputs.epoch }}
        with:
          context: .
          file: promtail/Dockerfile
          target: binaries
          platforms: linux/amd64,linux/arm64
          outputs: type=local,dest=${{ runner.temp }}/binaries
          build-args: ${{ steps.args.outputs.build-args }}
          provenance: false
          sbom: false

      - name: Package binaries
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ steps.args.outputs.epoch }}
        run: |
          "$RUNNER_TEMP/binaries/linux_amd64/alloy-promtail" --version
          mkdir "$RUNNER_TEMP/dist"
          cd "$RUNNER_TEMP/dist"
          for arch in amd64 arm64; do
            tar -cf - --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$SOURCE_DATE_EPOCH" \
              -C "$RUNNER_TEMP/binaries/linux_$arch" alloy-promtail -C "$GITHUB_WORKSPACE" LICENSE |
              gzip -9n >"alloy-promtail-$VERSION-linux-$arch.tar.gz"
          done
          sha256sum alloy-promtail-*.tar.gz >SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.tag.outputs.version }}
          UPSTREAM: ${{ steps.tag.outputs.upstream }}
          IMAGE: ${{ steps.tag.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          cd "$RUNNER_TEMP/dist"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber alloy-promtail-*.tar.gz SHA256SUMS
            exit 0
          fi
          cat >notes.md <<EOF
          Log collection distribution of Grafana Alloy, built from the upstream main branch after
          [$UPSTREAM](https://github.com/grafana/alloy/releases/tag/$UPSTREAM).

          Container image: \`$IMAGE:$VERSION\` (\`$DIGEST\`), linux/amd64 and linux/arm64,
          with SBOM and provenance attestations.

          The image and the binaries contain the \`base\` component group; build the \`k8s\`, \`cloud\`
          and \`secretfilter\` groups with \`COMPONENT_GROUPS\` as described in promtail/README.md.

          Verify the downloaded binaries with \`sha256sum -c SHA256SUMS --ignore-missing\`.
          EOF
          flags=(--verify-tag --title "alloy-promtail $VERSION" --notes-file notes.md)
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}" alloy-promtail-*.tar.gz SHA256SUMS
