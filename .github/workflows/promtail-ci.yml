name: promtail CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  check:
    name: check (${{ matrix.groups || 'base' }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        groups:
          - ""
          - "k8s cloud secretfilter"
    env:
      COMPONENT_GROUPS: ${{ matrix.groups }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch upstream tags
        # VERSION is derived from upstream release tags with git describe.
        run: git fetch --quiet --no-tags https://github.com/grafana/alloy.git 'refs/tags/v*:refs/tags/v*'

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install libsystemd headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libsystemd-dev

      - name: Check
        run: make -C promtail check

      - name: Report size
        run: |
          {
            echo "### alloy-promtail (${COMPONENT_GROUPS:-base})"
            echo
            make --no-print-directory -C promtail size
          } >>"$GITHUB_STEP_SUMMARY"

  image:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch upstream tags
        # VERSION is derived from upstream release tags with git describe.
        run: git fetch --quiet --no-tags https://github.com/grafana/alloy.git 'refs/tags/v*:refs/tags/v*'

      - name: Collect build arguments
        id: args
        run: |
          {
            echo "build-args<<EOF"
            echo "VERSION=$(git describe --tags --always --match 'v[0-9]*')"
            echo "GIT_REVISION=$(git rev-parse --short HEAD)"
            echo "GIT_BRANCH=${GITHUB_REF_NAME}"
            echo "BUILD_DATE=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build multi-arch image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: promtail/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: ${{ steps.args.outputs.build-args }}
          cache-from: type=gha,scope=promtail-image
          cache-to: type=gha,mode=max,scope=promtail-image

      - name: Load linux/amd64 image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: promtail/Dockerfile
          platforms: linux/amd64
          load: true
          tags: alloy-promtail:ci
          build-args: ${{ steps.args.outputs.build-args }}
          cache-from: type=gha,scope=promtail-image

      - name: Smoke test
        run: docker run --rm alloy-promtail:ci --version
